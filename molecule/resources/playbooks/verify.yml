---
# role: unbound
# file: molecule/resources/playbooks/verify.yml

- name: UNBOUND | Verify resolver behavior
  hosts: all
  gather_facts: true
  tasks:
    - name: UNBOUND | Verify service enablement and state
      ansible.builtin.systemd_service:
        name: unbound
        enabled: true
        state: started
      check_mode: true
      register: __unbound_service_check
      failed_when: __unbound_service_check.changed

    - name: UNBOUND | Verify DNS transports, zones and policies
      become: true
      become_user: root
      ansible.builtin.script:
        cmd: >-
          {{ (playbook_dir ~ '/../check_dns.py') | quote }}
          {{ ansible_facts.default_ipv4.address | quote }}
          {{ ansible_facts.os_family | quote }}
        executable: /usr/bin/python3
      changed_when: false
