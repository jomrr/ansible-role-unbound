---
# role: unbound
# file: vars/Suse.yml

__unbound_packages:
  - unbound
  - unbound-anchor
  - ca-certificates
__unbound_conf_dir: /etc/unbound/conf.d
__unbound_required_includes:
  - /etc/unbound/conf.d/remote-control.conf
__unbound_config_directories:
  - /etc/unbound/conf.d
  - /etc/unbound/local.d
  - /etc/unbound/keys.d
  - /etc/unbound/tls
__unbound_control_socket: /run/unbound/control.sock
__unbound_server_includes:
  - /etc/unbound/local.d/*.conf
__unbound_anchor_seeds: []
__unbound_platform_server:
  username: unbound
  chroot: ""
  directory: /etc/unbound
  pidfile: /run/unbound/unbound.pid
  auto-trust-anchor-file: /var/lib/unbound/root.key
  trusted-keys-file: /etc/unbound/keys.d/*.key
  tls-cert-bundle: /etc/ssl/ca-bundle.pem
__unbound_validate_command: /usr/sbin/unbound-checkconf %s
