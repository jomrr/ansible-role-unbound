---
# role: unbound
# file: tasks/install.yml

- name: UNBOUND | Install distribution packages
  become: true
  become_user: root
  ansible.builtin.package:
    name: '{{ __unbound_packages }}'
    state: present

- name: UNBOUND | Create configuration directories
  become: true
  become_user: root
  ansible.builtin.file:
    path: '{{ __unbound_directory }}'
    state: directory
    owner: root
    group: unbound
    mode: '0750'
  loop: '{{ __unbound_config_directories }}'
  loop_control:
    loop_var: __unbound_directory

- name: UNBOUND | Create writable zone directories
  become: true
  become_user: root
  ansible.builtin.file:
    path: '{{ __unbound_directory }}'
    state: directory
    owner: unbound
    group: unbound
    mode: '0750'
  loop:
    - /var/lib/unbound
    - /var/lib/unbound/rpz
    - /var/lib/unbound/auth
  loop_control:
    loop_var: __unbound_directory

- name: UNBOUND | Seed packaged DNSSEC trust anchors
  become: true
  become_user: root
  ansible.builtin.copy:
    src: '{{ __unbound_anchor.src }}'
    dest: '{{ __unbound_anchor.dest }}'
    remote_src: true
    force: false
    owner: unbound
    group: unbound
    mode: '0644'
  loop: '{{ __unbound_anchor_seeds }}'
  loop_control:
    loop_var: __unbound_anchor
    label: '{{ __unbound_anchor.dest }}'
