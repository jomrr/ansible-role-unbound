---
# role: unbound
# file: tasks/main.yml

- name: UNBOUND | Load platform variables
  ansible.builtin.include_vars:
    file: '{{ ansible_facts.os_family }}.yml'

- name: UNBOUND | Install resolver
  ansible.builtin.import_tasks: install.yml

- name: UNBOUND | Configure resolver
  ansible.builtin.import_tasks: configure.yml

- name: UNBOUND | Apply configuration changes
  ansible.builtin.meta: flush_handlers

- name: UNBOUND | Enable and start resolver
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    name: unbound
    enabled: true
    state: started
